name: Deploy to VNPT Cloud

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/nguyenanhduchl/lichcongtac-hlhpn:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          export COPYFILE_DISABLE=1
          tar --exclude='.git' --exclude='node_modules' --exclude='bin' --exclude='obj' --exclude='.env' --exclude='data_dump' --exclude='._*' -czf /tmp/deploy.tar.gz .
          mv /tmp/deploy.tar.gz .

      - name: Copy deployment package to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VNPT_HOST }}
          username: ${{ secrets.VNPT_USER }}
          key: ${{ secrets.VNPT_KEY }}
          source: "deploy.tar.gz"
          target: "/root/"

      - name: Execute deployment script on server
        uses: appleboy/ssh-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VNPT_HOST }}
          username: ${{ secrets.VNPT_USER }}
          key: ${{ secrets.VNPT_KEY }}
          envs: GITHUB_TOKEN,GITHUB_ACTOR
          script: |
            set -e
            mkdir -p /root/lichcongtac-hlhpn
            cd /root/lichcongtac-hlhpn
            tar -xzf /root/deploy.tar.gz
            
            echo $GITHUB_TOKEN | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin
            docker compose pull
            docker compose up -d --no-build
            
            docker image prune -f || true
            rm -f /root/deploy.tar.gz
